class SegDNA {
    constructor(d=0){
        this.l=Math.random()*20+35;this.t=Math.random()*4+5;this.a=(Math.random()-0.5)*1.8;
        this.weightAngle = (Math.random() - 0.5) * 2;this.weightTouch = (Math.random() - 0.5) * 2;this.bias = (Math.random() - 0.5) * 1;
        this.ch=[];
        if(d===0) {
            this.ch.push(new SegDNA(1));this.ch.push(new SegDNA(1)); 
        } else if(d < maxSkeletonDepth && Math.random()<0.7) {
            this.ch.push(new SegDNA(d+1));if(Math.random()<0.3) this.ch.push(new SegDNA(d+1)); 
        }
    }
}
class DNA { constructor(){this.r=new SegDNA(0);this.f=0;} }
function clone(n){let c=Object.assign(Object.create(Object.getPrototypeOf(n)),n);c.ch=n.ch.map(clone);return c;}

function rehydrateSegment(rawData) {
    let segment = new SegDNA();
    segment.l = rawData.l; segment.t = rawData.t; segment.a = rawData.a;
    segment.weightAngle = rawData.weightAngle; segment.weightTouch = rawData.weightTouch; segment.bias = rawData.bias;
    segment.ch = (rawData.ch || []).map(childData => rehydrateSegment(childData));
    return segment;
}

document.getElementById('copy-btn').addEventListener('click', () => {

        const parsedRawObj = JSON.parse(rawText);
        pop[cIdx].r = rehydrateSegment(parsedRawObj);
        pop[cIdx].f = 0;

function mutate(n, d=0){
    if(Math.random()<0.3)n.l=Math.max(20,Math.min(65,n.l+(Math.random()-0.5)*10));
    if(Math.random()<0.3)n.t=Math.max(4,Math.min(12,n.t+(Math.random()-0.5)*2));
    if(Math.random()<0.3)n.a=Math.max(-2.0,Math.min(2.0,n.a+(Math.random()-0.5)*0.3));
    if(Math.random()<0.4) n.weightAngle += (Math.random() - 0.5) * 0.4;
    if(Math.random()<0.4) n.weightTouch += (Math.random() - 0.5) * 0.4;
    if(Math.random()<0.4) n.bias += (Math.random() - 0.5) * 0.2;
    if(Math.random()<0.15 && d < maxSkeletonDepth && n.ch.length<3) n.ch.push(new SegDNA(d+1));
    if((n.ch.length>0 && d>0 && Math.random()<0.05) || (d >= maxSkeletonDepth)) n.ch.splice(0, n.ch.length);
    n.ch.forEach(c=>mutate(c, d+1));
}

class Pt{constructor(x,y){this.x=x;this.y=y;this.oX=x;this.oY=y;this.isGround=false;}}
class Bone{constructor(p1,p2,len,thick){this.p1=p1;this.p2=p2;this.l=len;this.t=thick;}}
class Muscle{constructor(p1,p2,baseLen,dna){this.p1=p1;this.p2=p2;this.bL=baseLen;this.cL=baseLen;this.d=dna;this.tn=0;}}

class Creature {
    constructor(dna){
        this.dna=dna;this.pts=[];this.bones=[];this.muscles=[];this.sX=200;
        let p0=new Pt(this.sX,GROUND_Y-140),p1=new Pt(this.sX+dna.r.l,GROUND_Y-140);
        this.pts.push(p0,p1);this.bones.push(new Bone(p0,p1,dna.r.l,dna.r.t));
        let self=this;
        function bld(node,pPt,pParentPt,cAn){
            let a=cAn+node.a;let endPt=new Pt(pPt.x+Math.cos(a)*node.l,pPt.y+Math.sin(a)*node.l);self.pts.push(endPt);
            self.bones.push(new Bone(pPt,endPt,node.l,node.t));
            let dx=endPt.x-pParentPt.x,dy=endPt.y-pParentPt.y,diagonalDistance=Math.sqrt(dx*dx+dy*dy)||1;
            self.muscles.push(new Muscle(pParentPt,endPt,diagonalDistance,node));
            node.ch.forEach(c=>bld(c,endPt,pPt,a));
        }
        dna.r.ch.forEach(c=>bld(c,p1,p0,0));
    }
    update(){
        this.pts.forEach(p=>{let vx=(p.x-p.oX)*0.85,vy=(p.y-p.oY)*0.85;p.oX=p.x;p.oY=p.y;p.x+=vx;p.y+=vy+0.45;});
        this.muscles.forEach(m=>{
            if(m.d){
                let currentBoneAngle = Math.atan2(m.p2.y - m.p1.y, m.p2.x - m.p1.x);
                let touchInput = (m.p1.isGround || m.p2.isGround) ? 1.0 : 0.0;
                let neuralSignal = (currentBoneAngle * m.d.weightAngle) + (touchInput * m.d.weightTouch) + m.d.bias;
                let networkDecision = Math.tanh(neuralSignal);
                m.tn = networkDecision;m.cL = m.bL * (1.0 + networkDecision * 0.35);
            }
        });
        for(let p=0;p<8;p++){
            this.bones.forEach(b=>{
                let dx=b.p2.x-b.p1.x,dy=b.p2.y-b.p1.y,ds=Math.sqrt(dx*dx+dy*dy)||1,df=b.l-ds;
                let co=(df/ds)*0.5,ox=dx*co,oy=dy*co;b.p1.x-=ox;b.p1.y-=oy;b.p2.x+=ox;b.p2.y+=oy;
            });
            this.muscles.forEach(m=>{
                let dx=m.p2.x-m.p1.x,dy=m.p2.y-m.p1.y,ds=Math.sqrt(dx*dx+dy*dy)||1,df=m.cL-ds;
                let co=(df/ds)*0.3,ox=dx*co,oy=dy*co;m.p1.x-=ox;m.p1.y-=oy;m.p2.x+=ox;m.p2.y+=oy;
            });
            this.pts.forEach(p=>{if(p.y>=GROUND_Y){p.y=GROUND_Y;p.x=p.oX;p.oY=GROUND_Y;p.isGround=true;}else{p.isGround=false;}});
        }
    }
    draw(){
        cx.strokeStyle='#555';cx.lineWidth=4;cx.beginPath();cx.moveTo(0,GROUND_Y);cx.lineTo(cv.width,GROUND_Y);cx.stroke();

    }

}

function start(){
    document.getElementById("g").innerText=gen;document.getElementById("c").innerText=cIdx+1;
    cc=new Creature(pop[cIdx]);ticks=0;
}
function nextGen(){
    pop.sort((a,b)=>b.f-a.f);
    if(pop[0].f>best)best=pop[0].f;
    document.getElementById("b").innerText=Math.round(best);
    
    let nP=[];
    let survivor1 = new DNA(); survivor1.r = clone(pop[0].r); survivor1.f = pop[0].f;
    let survivor2 = new DNA(); survivor2.r = clone(pop[1].r); survivor2.f = pop[1].f;
    nP.push(survivor1, survivor2);

        let parent=pop[Math.floor(Math.random()*3)];
        let child=new DNA();child.r=clone(parent.r);mutate(child.r);nP.push(child);
    }
    pop=nP;
    cIdx=0;gen++;start();
}
function loop(){
    cx.clearRect(0, 0, cv.width, cv.height);

        cc.update();cc.draw();ticks++;

    }
    requestAnimationFrame(loop);
}
for(let i=0;i<PS;i++)pop.push(new DNA());
start();loop();

<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Evolution</title>
<style>body{margin:0;background:#161616;color:#fff;font-family:sans-serif;overflow:hidden;}
#ui,#nu{position:absolute;top:10px;background:rgba(0,0,0,0.8);padding:12px;border-radius:6px;border:1px solid #444;z-index:100;width:240px;box-sizing:border-box;}
#ui{left:10px;}#nu{right:10px;}h2{margin:0;color:#4caf50;font-size:16px;}p{margin:4px 0 0 0;font-size:12px;color:#bbb;}span{font-weight:bold;color:#fff;}

<div id="ui"><h2>Gen: <span id="g">1</span></h2><p>Best: <span id="b">0</span>px</p><p>Test: <span id="c">1</span>/10</p>

<button id="cb">📋 Copy to Clipboard</button><textarea id="li" style="height:35px;margin-top:6px;" placeholder="Paste here..."></textarea><button id="lb" style="background:#2196f3;margin-top:2px;">📥 Load Creature</button></div>
<div id="nu"><h2 style="color:#2196f3;font-size:14px;margin-bottom:6px;">Live Brain Matrix</h2><canvas id="nc" width="215" height="150" style="background:#222;border-radius:4px;"></canvas></div><canvas id="s"></canvas><script>
const cv=document.getElementById('s'),cx=cv.getContext('2d'),nc=document.getElementById('nc'),nx=nc.getContext('2d');
cv.width=window.innerWidth;cv.height=window.innerHeight;const GY=cv.height-180,PS=10,MT=240;
let pop=[],cIdx=0,gen=1,cc=null,best=0,ticks=0,maxD=3,rtc=0,camX=0;
document.getElementById('ds').addEventListener('input',(e)=>{maxD=parseInt(e.target.value);document.getElementById('dv').innerText=maxD;});
const randW=(n)=>{let a=[];for(let i=0;i<n;i++)a.push((Math.random()-0.5)*2);return a;};
const mutW=(a,r,m)=>a.map(w=>Math.random()<r?Math.max(-2,Math.min(2,w+(Math.random()-0.5)*m)):w);
class SegDNA {
    constructor(d=0){
        this.l=Math.random()*20+35;this.t=Math.random()*4+5;this.a=(Math.random()-0.5)*1.8;this.wIH=randW(16);this.wHO=randW(16);this.bi=randW(8);this.ch=[];
        if(d===0){this.ch.push(new SegDNA(1),new SegDNA(1));}else if(d<maxD&&Math.random()<0.7){this.ch.push(new SegDNA(d+1));if(Math.random()<0.3)this.ch.push(new SegDNA(d+1));}
    }
}
class DNA{constructor(){this.r=new SegDNA(0);this.f=0;}}
function clone(n){let c=Object.assign(Object.create(Object.getPrototypeOf(n)),n);c.ch=n.ch.map(clone);return c;}
function rehydrate(r){let s=new SegDNA();s.l=r.l;s.t=r.t;s.a=r.a;s.wIH=[...r.wIH];s.wHO=[...r.wHO];s.bi=[...r.bi];s.ch=(r.ch||[]).map(rehydrate);return s;}
document.getElementById('cb').addEventListener('click',()=>{if(pop[cIdx])navigator.clipboard.writeText(JSON.stringify(pop[cIdx].r));});
document.getElementById('lb').addEventListener('click',()=>{try{pop[cIdx].r=rehydrate(JSON.parse(document.getElementById('li').value.trim()));pop[cIdx].f=0;cc=new Creature(pop[cIdx]);ticks=0;}catch(e){alert("Error!");}});
function mutate(n,d=0){
    if(Math.random()<0.3)n.l=Math.max(20,Math.min(65,n.l+(Math.random()-0.5)*10));if(Math.random()<0.3)n.t=Math.max(4,Math.min(12,n.t+(Math.random()-0.5)*2));if(Math.random()<0.3)n.a=Math.max(-2,Math.min(2,n.a+(Math.random()-0.5)*0.3));
    n.wIH=mutW(n.wIH,0.35,0.4);n.wHO=mutW(n.wHO,0.35,0.4);n.bi=mutW(n.bi,0.35,0.2);if(Math.random()<0.15&&d<maxD&&n.ch.length<3)n.ch.push(new SegDNA(d+1));
    if((n.ch.length>0&&d>0&&Math.random()<0.05)||(d>=maxD))n.ch.splice(0,n.ch.length);n.ch.forEach(c=>mutate(c,d+1));
}
class Pt{constructor(x,y){this.x=x;this.y=y;this.oX=x;this.oY=y;this.ig=false;}}
class Bone{constructor(p1,p2,len,thick){this.p1=p1;this.p2=p2;this.l=len;this.t=thick;}}
class Muscle{constructor(p1,p2,baseLen,dna){this.p1=p1;this.p2=p2;this.bL=baseLen;this.cL=baseLen;this.d=dna;this.tn=0;}}
class Creature {
    constructor(dna){
        this.dna=dna;this.pts=[];this.bones=[];this.muscles=[];this.sX=200;let p0=new Pt(this.sX,GY-140),p1=new Pt(this.sX+dna.r.l,GY-140);this.pts.push(p0,p1);this.bones.push(new Bone(p0,p1,dna.r.l,dna.r.t));
        let self=this;function bld(node,pPt,pParentPt,cAn){
            let a=cAn+node.a,eP=new Pt(pPt.x+Math.cos(a)*node.l,pPt.y+Math.sin(a)*node.l);self.pts.push(eP);self.bones.push(new Bone(pPt,eP,node.l,node.t));
            let dX=eP.x-pParentPt.x,dY=eP.y-pParentPt.y,ds=Math.sqrt(dX*dX+dY*dY)||1;self.muscles.push(new Muscle(pParentPt,eP,ds,node));node.ch.forEach(c=>bld(c,eP,pPt,a));
        }
        dna.r.ch.forEach(c=>bld(c,p1,p0,0));
        this.sV=[0,0,0,0];this.hV=[0,0,0,0];this.oV=[0,0,0,0];
    }
    update(){
        this.pts.forEach(p=>{let vx=(p.x-p.oX)*0.85,vy=(p.y-p.oY)*0.85;p.oX=p.x;p.oY=p.y;p.x+=vx;p.y+=vy+0.45;});
        
        // FIXED: Safe array parsing without brackets to protect data compile
        let mainBoneSegment = this.bones.find(()=>true);
        this.sV[0]=Math.sin(ticks*0.05);
        this.sV[1]=mainBoneSegment ? Math.atan2(mainBoneSegment.p2.y-mainBoneSegment.p1.y,mainBoneSegment.p2.x-mainBoneSegment.p1.x) : 0;
        this.sV[2]=this.pts.some(p=>p.ig)?1:0;
        this.sV[3]=Math.sin(rtc*0.1);
        
        let dB=this.dna.r;
        for(let h=0;h<4;h++){let sum=dB.bi[h];for(let i=0;i<4;i++)sum+=this.sV[i]*dB.wIH[h*4+i];this.hV[h]=Math.tanh(sum);}
        for(let o=0;o<4;o++){let sum=dB.bi[4+o];for(let h=0;h<4;h++)sum+=this.hV[h]*dB.wHO[o*4+h];this.oV[o]=Math.tanh(sum);}
        this.muscles.forEach((m,idx)=>{if(m.d){m.tn=this.oV[idx%4];m.cL=m.bL*(1+m.tn*0.35);}});
        for(let p=0;p<8;p++){
            this.bones.forEach(b=>{let dx=b.p2.x-b.p1.x,dy=b.p2.y-b.p1.y,ds=Math.sqrt(dx*dx+dy*dy)||1,df=b.l-ds,co=(df/ds)*0.5,ox=dx*co,oy=dy*co;b.p1.x-=ox;b.p1.y-=oy;b.p2.x+=ox;b.p2.y+=oy;});
            this.muscles.forEach(m=>{let dx=m.p2.x-m.p1.x,dy=m.p2.y-m.p1.y,ds=Math.sqrt(dx*dx+dy*dy)||1,df=m.cL-ds,co=(df/ds)*0.3,ox=dx*co,oy=dy*co;m.p1.x-=ox;m.p1.y-=oy;m.p2.x+=ox;m.p2.y+=oy;});
            this.pts.forEach(p=>{if(p.y>=GY){p.y=GY;p.x=p.oX;p.oY=GY;p.ig=true;}else{p.ig=false;}});
        }
        camX+=(this.getavg()-300-camX)*0.08;
    }
    draw(){
        cx.save();cx.translate(-camX,0);cx.strokeStyle='#555';cx.lineWidth=4;cx.beginPath();cx.moveTo(camX,GY);cx.lineTo(camX+cv.width,GY);cx.stroke();
        this.muscles.forEach(m=>{cx.strokeStyle=m.tn>0?'#ff1744':'#9a0007';cx.lineWidth=m.tn>0?4:2;cx.beginPath();cx.moveTo(m.p1.x,m.p1.y);cx.lineTo(m.p2.x,m.p2.y);cx.stroke();});
        this.bones.forEach(b=>{cx.strokeStyle='#4caf50';cx.lineWidth=b.t;cx.lineCap='round';cx.beginPath();cx.moveTo(b.p1.x,b.p1.y);cx.lineTo(b.p2.x,b.p2.y);cx.stroke();});
        this.pts.forEach(p=>{cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x,p.y,5,0,Math.PI*2);cx.fill();});cx.restore();drFB(this.sV,this.hV,this.oV,this.dna.r);
    }
    getavg(){let s=0;this.pts.forEach(p=>s+=p.x);return s/this.pts.length;}
}
function drFB(sV,hV,oV,dB){
    nx.clearRect(0,0,nc.width,nc.height);let sX=20,hX=105,oX=190;
    let sY=Array.from({length:4},(_,i)=>30+i*32),hY=Array.from({length:4},(_,i)=>30+i*32),oY=Array.from({length:4},(_,i)=>30+i*32);
    for(let i=0;i<4;i++){let inI=Math.abs(sV[i]);for(let h=0;h<4;h++){let w=dB.wIH[h*4+i],op=Math.max(0.1,Math.min(0.8,inI*0.8));nx.lineWidth=Math.abs(w)*2.5+0.5;nx.strokeStyle=w>0?`rgba(76,175,80,${op})`:`rgba(255,23,68,${op})`;nx.beginPath();nx.moveTo(sX,sY[i]);nx.lineTo(hX,hY[h]);nx.stroke();}}
    for(let h=0;h<4;h++){let hdI=Math.abs(hV[h]);for(let o=0;o<4;o++){let w=dB.wHO[o*4+h],op=Math.max(0.1,Math.min(0.8,hdI*0.8));nx.lineWidth=Math.abs(w)*2.5+0.5;nx.strokeStyle=w>0?`rgba(76,175,80,${op})`:`rgba(255,23,68,${op})`;nx.beginPath();nx.moveTo(hX,hY[h]);nx.lineTo(oX,oY[o]);nx.stroke();}}
    for(let i=0;i<4;i++){nx.fillStyle='#fff';nx.shadowBlur=Math.abs(sV[i])*10;nx.shadowColor='#2196f3';nx.beginPath();nx.arc(sX,sY[i],5,0,Math.PI*2);nx.fill();}
    for(let h=0;h<4;h++){nx.fillStyle='#fff';nx.shadowBlur=Math.abs(hV[h])*10;nx.shadowColor='#9c27b0';nx.beginPath();nx.arc(hX,hY[h],5,0,Math.PI*2);nx.fill();}
    for(let o=0;o<4;o++){nx.fillStyle='#fff';nx.shadowBlur=Math.abs(oV[o])*12;nx.shadowColor=oV[o]>0?'#ff1744':'#b71c1c';nx.beginPath();nx.arc(oX,oY[o],5,0,Math.PI*2);nx.fill();}
    nx.shadowBlur=0;nx.fillStyle='#aaa';nx.font='8px sans-serif';nx.fillText("SENSORS",5,14);nx.fillText("HIDDEN",85,14);nx.fillText("MUSCLES",170,14);
}
function start(){document.getElementById("g").innerText=gen;document.getElementById("c").innerText=cIdx+1;cc=new Creature(pop[cIdx]);ticks=0;camX=0;}
function nextGen(){
    pop.sort((a,b)=>b.f-a.f);if(pop[0].f>best)best=pop[0].f;document.getElementById("b").innerText=Math.round(best);
    let nP=[];let s1=new DNA();s1.r=clone(pop[0].r);s1.f=pop[0].f;let s2=new DNA();s2.r=clone(pop[0].r);s2.f=pop[0].f;nP.push(s1,s2);
    while(nP.length<PS){let p=pop[Math.floor(Math.random()*3)];let c=new DNA();c.r=clone(p.r);mutate(c.r);nP.push(c);}
    pop=nP;cIdx=0;gen++;start();
}
function loop(){cx.clearRect(0,0,cv.width,cv.height);if(cc){rtc+=0.15;cc.update();cc.draw();ticks++;if(ticks>=MT){pop[cIdx].f=Math.max(0,cc.getavg()-cc.sX);cIdx++;if(cIdx<PS)start();else nextGen();}}requestAnimationFrame(loop);}
for(let i=0;i<PS;i++)pop.push(new DNA());
start();loop();
window.addEventListener('resize',()=>{cv.width=window.innerWidth;cv.height=window.innerHeight;});
</script></body></html>
