<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deterministic Base 3/2 Tree Visualizer</title>
  <style>
    body { font-family: monospace; background: #000000; color: #00ff00; padding: 20px; }
    .controls { background: #111; padding: 15px; border: 1px solid #00ff00; margin-bottom: 20px; }
    button { background: #00ff00; color: #000; font-weight: bold; padding: 8px 15px; border: none; cursor: pointer; }
    input { background: #000; color: #00ff00; border: 1px solid #00ff00; padding: 5px; width: 60px; }
    /* Tree layout canvas configuration */
    #svg-layer { border: 1px solid #333; margin-top: 10px; display: block; background: #050505; }
    line { stroke: #00ff00; stroke-width: 2; }
    circle { fill: #000000; stroke: #00ff00; stroke-width: 2; }
    text { fill: #00ff00; font-size: 12px; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
  </style>
</head>
<body>

  <h1>[SYS_STATUS]: BASE 3/2 TREE DIAGRAM GENERATOR</h1>
  
  <div class="controls">
    <label>Target Nodes to Render: <input type="number" id="nodeCount" value="15" min="2" max="40"></label>
    <button id="renderBtn">FORCE DRAW CANVAS</button>
  </div>

  <!-- Hardcoded viewport sizes isolate code against container size collapse -->
  <svg id="svg-layer" width="900" height="550" viewBox="0 0 900 550"></svg>

  <script>
    // Pure mathematical mapping of the canonical Base 3/2 Representation Tree
    // Nodes are systematically generated sequentially to ensure zero math dead-ends
    function generateTreeLayout(totalNodes) {
      let nodes = [];
      let edges = [];
      
      // Step 1: Initialize the Root foundation structure
      nodes.push({ id: 0, val: 0, x: 450, y: 50, depth: 0 });
      nodes.push({ id: 1, val: 3, x: 450, y: 130, depth: 1 });
      edges.push({ from: 0, to: 1, digit: 2 });

      let currentParentIndex = 1;
      let nextNodeId = 2;
      let currentValMultiplier = 6;
      let cyclicDigits = [1, 0, 2];
      let digitTracker = 0;

      // Step 2: Systematically build out tiers breadth-first
      for (let depth = 2; depth <= 5; depth++) {
        let parentNodesInLayer = nodes.filter(n => n.depth === depth - 1);
        if (parentNodesInLayer.length === 0 || nextNodeId >= totalNodes) break;

        let horizontalSpread = 380 / Math.pow(1.5, depth);
        
        for (let p = 0; p < parentNodesInLayer.length; p++) {
          let parent = parentNodesInLayer[p];
          
          // The structural sequence rule alternates branching density
          let branchesCount = (parent.id % 2 === 1) ? 2 : 1;
          
          for (let b = 0; b < branchesCount; b++) {
            if (nextNodeId >= totalNodes) break;

            // Calculate x spatial layouts relative to parent center position
            let xOffset = 0;
            if (branchesCount > 1) {
              xOffset = (b === 0) ? -horizontalSpread : horizontalSpread;
            }

            let newX = parent.x + xOffset;
            let newY = 50 + (depth * 95);

            nodes.push({
              id: nextNodeId,
              val: currentValMultiplier,
              x: newX,
              y: newY,
              depth: depth
            });

            edges.push({
              from: parent.id,
              to: nextNodeId,
              digit: cyclicDigits[digitTracker % 3]
            });

            digitTracker++;
            currentValMultiplier += 3;
            nextNodeId++;
          }
        }
      }
      return { nodes, edges };
    }

    function render() {
      const canvas = document.getElementById("svg-layer");
      if (!canvas) return;
      
      // Flush previous inner string definitions out cleanly
      canvas.innerHTML = '';

      const maxNodes = parseInt(document.getElementById("nodeCount").value) || 15;
      const data = generateTreeLayout(maxNodes);

      let structuralMarkup = "";

      // Step 3: Write raw template data directly into string lines to avoid DOM collision lag
      data.edges.forEach(edge => {
        let pNode = data.nodes.find(n => n.id === edge.from);
        let cNode = data.nodes.find(n => n.id === edge.to);
        if (pNode && cNode) {
          structuralMarkup += `<line x1="${pNode.x}" y1="${pNode.y}" x2="${cNode.x}" y2="${cNode.y}" />`;
          // Inject exact remainder paths along middle coordinate points
          let mx = (pNode.x + cNode.x) / 2 - 12;
          let my = (pNode.y + cNode.y) / 2;
          structuralMarkup += `<text x="${mx}" y="${my}" style="fill:#ffaa00; font-size:10px;">d:${edge.digit}</text>`;
        }
      });

      data.nodes.forEach(node => {
        structuralMarkup += `
          <g>
            <circle cx="${node.x}" cy="${node.y}" r="18" />
            <text x="${node.x}" y="${node.y}">${node.val}</text>
          </g>
        `;
      });

      // Inject the whole layout structure directly into the document window
      canvas.innerHTML = structuralMarkup;
    }

    // Bind clean listener triggers and bypass automatic timing crashes
    document.getElementById("renderBtn").addEventListener("click", render);
    window.onload = render;
  </script>
</body>
</html>
