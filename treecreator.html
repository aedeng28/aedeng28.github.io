<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accurate Positional Base a/b Tree Visualizer</title>
  <style>
    body { font-family: monospace; background: #000000; color: #00ff00; padding: 20px; margin: 0; }
    .controls { background: #111; padding: 15px; border: 1px solid #00ff00; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .param-group { display: flex; align-items: center; gap: 8px; }
    button { background: #00ff00; color: #000; font-weight: bold; padding: 8px 20px; border: none; cursor: pointer; font-family: monospace; font-size: 14px; }
    button:hover { background: #00cc00; }
    input { background: #000; color: #00ff00; border: 1px solid #00ff00; padding: 6px; width: 60px; font-family: monospace; font-size: 14px; text-align: center; }
    #svg-layer { border: 1px solid #333; display: block; background: #050505; margin-top: 10px; width: 100%; height: 600px; }
    line { stroke: #00ff00; stroke-width: 2; }
    circle { fill: #000000; stroke: #00ff00; stroke-width: 2; }
    text { fill: #00ff00; font-size: 11px; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
    .digit-label { fill: #ffaa00; font-size: 11px; }
    #info-panel { margin-top: 10px; color: #888; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>

  <h1>[SYS_STATUS]: TRUE POSITIONAL RATIONAL BASE a/b TREE</h1>
  
  <div class="controls">
    <div class="param-group">
      <label>Base Numerator (a):</label>
      <input type="number" id="baseA" value="3" min="2">
    </div>
    <div class="param-group">
      <label>Base Denominator (b):</label>
      <input type="number" id="baseB" value="2" min="1">
    </div>
    <div class="param-group">
      <label>Target Integer (N):</label>
      <input type="number" id="rootVal" value="4">
    </div>
    <div class="param-group">
      <label>Max Depth:</label>
      <input type="number" id="maxDepth" value="4" min="1" max="6">
    </div>
    <button id="renderBtn">RENDER ACCURATE TREE</button>
  </div>

  <svg id="svg-layer" viewBox="0 0 1000 650"></svg>
  
  <div id="info-panel">
    * <strong>Root Node</strong> represents your target base-10 integer.<br>
    * <strong>Branch Nodes</strong> display their precise, independent positional contribution value to the total sum: <strong>d * (b/a)^depth</strong>.
  </div>

  <script>
    // Pure mathematical positional resolution engine
    function getValidDigitsForState(remainderState, a, b) {
      let validDigits = [];
      // Positional digits for base a/b strictly range from 0 up to a-1
      for (let d = 0; d < a; d++) {
        let numericCheck = (a * remainderState) - d;
        if (numericCheck % b === 0) {
          validDigits.push({ nextState: numericCheck / b, digit: d });
        }
      }
      return validDigits;
    }

    function buildTreeData() {
      const a = parseInt(document.getElementById("baseA").value) || 3;
      const b = parseInt(document.getElementById("baseB").value) || 2;
      const rootVal = parseInt(document.getElementById("rootVal").value);
      const maxDepth = parseInt(document.getElementById("maxDepth").value) || 4;

      if (isNaN(rootVal)) return null;

      let nodes = [];
      let edges = [];
      let globalIdCounter = 0;

      // Queue keeps track of the spatial canvas constraints alongside the running mathematical state evaluation
      let queue = [{ 
        id: globalIdCounter++, 
        state: rootVal, 
        displayVal: rootVal.toString(), // Root retains its clean initial base-10 target integer presentation
        depth: 0, 
        x: 500, 
        y: 50, 
        xMin: 0, 
        xMax: 1000 
      }];

      while (queue.length > 0) {
        let current = queue.shift();
        nodes.push(current);

        if (current.depth >= maxDepth) continue;

        let branches = getValidDigitsForState(current.state, a, b);
        let nChildren = branches.length;
        if (nChildren === 0) continue;

        let segmentWidth = (current.xMax - current.xMin) / nChildren;

        branches.forEach((branch, index) => {
          let childXMin = current.xMin + (index * segmentWidth);
          let childXMax = childXMin + segmentWidth;
          let childX = childXMin + (segmentWidth / 2);
          let childY = 50 + ((current.depth + 1) * 110);

          // Correctly calculate the node's true place value contribution: d * (b/a)^depth
          let placeValueWeight = Math.pow(b / a, current.depth + 1);
          let exactContribution = branch.digit * placeValueWeight;
          
          // Formats values into clean, scannable decimals (e.g. 0.67 instead of 0.666666666)
          let nodeLabel = exactContribution === 0 ? "0" : exactContribution.toFixed(2);

          let childNode = {
            id: globalIdCounter++,
            state: branch.nextState,
            displayVal: nodeLabel,
            depth: current.depth + 1,
            x: childX,
            y: childY,
            xMin: childXMin,
            xMax: childXMax
          };

          edges.push({
            fromId: current.id,
            toId: childNode.id,
            digit: branch.digit
          });

          queue.push(childNode);
        });
      }

      return { nodes, edges };
    }

    function render() {
      const canvas = document.getElementById("svg-layer");
      if (!canvas) return;
      
      canvas.innerHTML = '';
      const data = buildTreeData();
      if (!data) return;

      let structuralMarkup = "";

      // Step 1: Paint branch connector tracks
      data.edges.forEach(edge => {
        let pNode = data.nodes.find(n => n.id === edge.fromId);
        let cNode = data.nodes.find(n => n.id === edge.toId);
        if (pNode && cNode) {
          structuralMarkup += `<line x1="${pNode.x}" y1="${pNode.y}" x2="${cNode.x}" y2="${cNode.y}" />`;
          let mx = (pNode.x + cNode.x) / 2;
          let my = (pNode.y + cNode.y) / 2 - 10;
          structuralMarkup += `<text x="${mx}" y="${my}" class="digit-label">d:${edge.digit}</text>`;
        }
      });

      // Step 2: Paint accurate value vector nodes
      data.nodes.forEach(node => {
        structuralMarkup += `
          <g>
            <circle cx="${node.x}" cy="${node.y}" r="22" />
            <text x="${node.x}" y="${node.y}">${node.displayVal}</text>
          </g>
        `;
      });

      canvas.innerHTML = structuralMarkup;
    }

    document.getElementById("renderBtn").addEventListener("click", render);
    window.onload = render;
  </script>
</body>
</html>
