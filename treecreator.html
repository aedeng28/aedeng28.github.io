<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Base a/b Tree Visualizer</title>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; margin: 20px; }
    .controls { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
    input { width: 60px; padding: 5px; background: #333; color: #fff; border: 1px solid #555; }
    button { padding: 5px 15px; background: #007acc; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #005999; }
    svg { background: #111; border: 1px solid #444; width: 100%; height: 600px; }
    circle { fill: #4fc3f7; stroke: #fff; stroke-width: 1.5px; }
    line { stroke: #555; stroke-width: 2px; }
    text { fill: #fff; font-size: 12px; font-family: monospace; text-anchor: middle; dominant-baseline: central; }
  </style>
</head>
<body>

  <h1>Base $a/b$ Tree Visualizer</h1>
  <div class="controls">
    <label>Base a: <input type="number" id="baseA" value="3"></label>
    <label>Base b: <input type="number" id="baseB" value="2"></label>
    <label>Root Value: <input type="number" id="rootVal" value="2"></label>
    <label>Max Depth: <input type="number" id="maxDepth" value="4" max="6"></label>
    <button onclick="renderTree()">Generate Tree</button>
  </div>

  <svg id="tree"></svg>

  <script>
    // 1. Correct SVG Namespace
    const svgNS = "http://w3.org";
    const svgCanvas = document.getElementById("tree");

    // Helper to clear previous tree
    function clearCanvas() {
      svgCanvas.innerHTML = '';
    }

    // 2. Fixed Line Creation Element Type
    function createline(x1, y1, x2, y2) {
      const newLine = document.createElementNS(svgNS, "line");
      newLine.setAttribute("x1", x1);
      newLine.setAttribute("y1", y1);
      newLine.setAttribute("x2", x2);
      newLine.setAttribute("y2", y2);
      svgCanvas.appendChild(newLine);
    }

    // 3. Circle Creation with Text Label
    function createNode(cx, cy, r, label) {
      const g = document.createElementNS(svgNS, "g");
      
      const circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", cy);
      circle.setAttribute("r", r);
      g.appendChild(circle);

      const text = document.createElementNS(svgNS, "text");
      text.setAttribute("x", cx);
      text.setAttribute("y", cy);
      text.textContent = label;
      g.appendChild(text);

      svgCanvas.appendChild(g);
    }

    // 4. Base a/b Tree Transition Math
    // Determines the available valid digit/remainder transitions
    function getNextValues(x, a, b) {
      let transitions = [];
      // In base a/b, the standard transition steps solve: bx' = ax - d
      // Where d is a valid digit choice. For base 3/2, digits are typically {0, 1, 2}
      for (let digit = 0; digit < a; digit++) {
        let remainder = (a * x - digit);
        if (remainder % b === 0) {
          let nextX = remainder / b;
          transitions.push({ nextX: nextX, digit: digit });
        }
      }
      return transitions;
    }

    // 5. Core Recursive Branching Function
    function buildBranch(x, a, b, currentDepth, maxDepth, xPos, yPos, horizontalSpacing) {
      if (currentDepth > maxDepth) return;

      let nextSteps = getNextValues(x, a, b);
      let numChildren = nextSteps.length;

      nextSteps.forEach((step, index) => {
        // Calculate spread for children to prevent overlaps
        let childX = xPos;
        if (numChildren > 1) {
          let offset = (index - (numChildren - 1) / 2) * horizontalSpacing;
          childX += offset;
        }
        let childY = yPos + 80; // Distance down per level

        // Draw connection line
        createline(xPos, yPos, childX, childY);

        // Recurse deeper down the tree branch
        buildBranch(step.nextX, a, b, currentDepth + 1, maxDepth, childX, childY, horizontalSpacing * 0.5);
      });

      // Draw node circle on top of lines so it renders beautifully
      createNode(xPos, yPos, 18, x);
    }

    // Main controller to pull DOM values and trigger initialization
    function renderTree() {
      clearCanvas();
      
      const a = parseInt(document.getElementById("baseA").value);
      const b = parseInt(document.getElementById("baseB").value);
      const rootVal = parseInt(document.getElementById("rootVal").value);
      const maxDepth = parseInt(document.getElementById("maxDepth").value);

      // Center the root dynamically to the current SVG layout window size
      const startX = svgCanvas.clientWidth / 2 || 400;
      const startY = 40;
      const initialHorizontalSpread = 160;

      buildBranch(rootVal, a, b, 1, maxDepth, startX, startY, initialHorizontalSpread);
    }

    // Run initial generation on load
    window.onload = renderTree;
  </script>
</body>
</html>
