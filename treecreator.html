<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Base a/b Representation Tree (Multiples of a)</title>
  <style>
    body { font-family: monospace; background: #000000; color: #00ff00; padding: 20px; margin: 0; }
    .controls { background: #111; padding: 15px; border: 1px solid #00ff00; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .param-group { display: flex; align-items: center; gap: 8px; }
    button { background: #00ff00; color: #000; font-weight: bold; padding: 8px 20px; border: none; cursor: pointer; font-family: monospace; font-size: 14px; }
    button:hover { background: #00cc00; }
    input { background: #000; color: #00ff00; border: 1px solid #00ff00; padding: 6px; width: 60px; font-family: monospace; font-size: 14px; text-align: center; }
    #svg-layer { border: 1px solid #333; display: block; background: #050505; margin-top: 10px; width: 100%; height: 600px; }
    line { stroke: #00ff00; stroke-width: 2; }
    circle { fill: #000000; stroke: #00ff00; stroke-width: 2; cursor: pointer; }
    circle:hover { fill: #003300; }
    text { fill: #00ff00; font-size: 13px; text-anchor: middle; dominant-baseline: central; font-weight: bold; pointer-events: none; }
    .digit-label { fill: #ffaa00; font-size: 12px; font-weight: bold; }
    #info-panel { margin-top: 10px; color: #888; font-size: 12px; line-height: 1.5; }
    #tooltip { background: #111; color: #00ff00; padding: 10px; border: 1px solid #00ff00; border-radius: 4px; position: absolute; display: none; font-size: 13px; font-family: monospace; box-shadow: 0px 0px 10px #00ff00; }
  </style>
</head>
<body>

  <h1>[SYS_STATUS]: CANONICAL REPRESENTATION TREE (MULTIPLES OF a)</h1>
  
  <div class="controls">
    <div class="param-group">
      <label>Base Numerator (a):</label>
      <input type="number" id="baseA" value="3" min="2">
    </div>
    <div class="param-group">
      <label>Base Denominator (b):</label>
      <input type="number" id="baseB" value="2" min="1">
    </div>
    <div class="param-group">
      <label>Root Node (Multiple of a):</label>
      <input type="number" id="rootVal" value="3">
    </div>
    <div class="param-group">
      <label>Max Layers:</label>
      <input type="number" id="maxDepth" value="4" min="1" max="6">
    </div>
    <button id="renderBtn">GENERATE TREE</button>
  </div>

  <div id="tooltip"></div>
  <svg id="svg-layer" viewBox="0 0 1000 650"></svg>
  
  <div id="info-panel">
    * <strong>Constraint Rule:</strong> Every node in this tree is strictly a multiple of your base numerator (a). <br>
    * <strong>The Representation:</strong> Hover over any node to view the string path. Add a <strong>"0"</strong> to the end to get its complete base a/b positional expansion!
  </div>

  <script>
    // Filters and calculates children that are STRICTLY multiples of a
    function getValidMultiplesChildren(x, a, b) {
      let validBranches = [];
      // Alphabet digits for fractional base a/b systems range from 0 to a-1
      for (let d = 0; d < a; d++) {
        // Core inverse positional step equation
        let computedChild = ((b * x) / a) + d;
        
        // Ensure the output is an integer AND a perfect multiple of 'a'
        if (Number.isInteger(computedChild) && computedChild % a === 0) {
          validBranches.push({ value: computedChild, digit: d });
        }
      }
      return validBranches;
    }

    function buildTreeData() {
      const a = parseInt(document.getElementById("baseA").value) || 3;
      const b = parseInt(document.getElementById("baseB").value) || 2;
      const rootVal = parseInt(document.getElementById("rootVal").value);
      const maxDepth = parseInt(document.getElementById("maxDepth").value) || 4;

      // Enforcement validation checkpoint
      if (isNaN(rootVal) || rootVal % a !== 0) {
        alert(`Error: The root node must be a perfect multiple of a (${a})!`);
        return null;
      }

      let nodes = [];
      let edges = [];
      let globalIdCounter = 0;

      // Queue keeps track of the layout canvas horizontal fields to balance spacing
      let queue = [{ 
        id: globalIdCounter++, 
        val: rootVal, 
        pathString: "", 
        depth: 0, 
        x: 500, 
        y: 50, 
        xMin: 0, 
        xMax: 1000 
      }];

      while (queue.length > 0) {
        let current = queue.shift();
        nodes.push(current);

        if (current.depth >= maxDepth) continue;

        let children = getValidMultiplesChildren(current.val, a, b);
        let nChildren = children.length;
        if (nChildren === 0) continue;

        let segmentWidth = (current.xMax - current.xMin) / nChildren;

        children.forEach((child, index) => {
          let childXMin = current.xMin + (index * segmentWidth);
          let childXMax = childXMin + segmentWidth;
          let childX = childXMin + (segmentWidth / 2);
          let childY = 50 + ((current.depth + 1) * 110);

          // Update the path representation tracker string
          let updatedPath = current.pathString === "" ? `${child.digit}` : `${current.pathString}${child.digit}`;

          let childNode = {
            id: globalIdCounter++,
            val: child.value,
            pathString: updatedPath,
            depth: current.depth + 1,
            x: childX,
            y: childY,
            xMin: childXMin,
            xMax: childXMax
          };

          edges.push({
            fromId: current.id,
            toId: childNode.id,
            digit: child.digit
          });

          queue.push(childNode);
        });
      }

      return { nodes, edges };
    }

    function render() {
      const canvas = document.getElementById("svg-layer");
      const tooltip = document.getElementById("tooltip");
      if (!canvas) return;
      
      canvas.innerHTML = '';
      const data = buildTreeData();
      if (!data) return;

      let structuralMarkup = "";

      // Step 1: Draw branch connector lines
      data.edges.forEach(edge => {
        let pNode = data.nodes.find(n => n.id === edge.fromId);
        let cNode = data.nodes.find(n => n.id === edge.toId);
        if (pNode && cNode) {
          structuralMarkup += `<line x1="${pNode.x}" y1="${pNode.y}" x2="${cNode.x}" y2="${cNode.y}" />`;
          let mx = (pNode.x + cNode.x) / 2;
          let my = (pNode.y + cNode.y) / 2 - 10;
          structuralMarkup += `<text x="${mx}" y="${my}" class="digit-label">${edge.digit}</text>`;
        }
      });

      // Step 2: Draw node markers showing the accurate integers
      data.nodes.forEach(node => {
        let cleanPath = node.pathString === "" ? "[Root]" : node.pathString;
        let finalRepresentation = node.pathString === "" ? "0" : `${node.pathString}0`;

        let tooltipText = `
          <strong>Node Value:</strong> ${node.val}<br>
          <strong>Path Taken:</strong> ${cleanPath}<br>
          <strong>Base Expansion String (+0):</strong> <span style='color:#ffaa00'>${finalRepresentation}</span>
        `;

        structuralMarkup += `
          <g class="node-group" data-tip="${tooltipText}">
            <circle cx="${node.x}" cy="${node.y}" r="20" />
            <text x="${node.x}" y="${node.y}">${node.val}</text>
          </g>
        `;
      });

      canvas.innerHTML = structuralMarkup;

      // Step 3: Wire tooltip tracking updates
      document.querySelectorAll('.node-group').forEach(item => {
        item.addEventListener('mousemove', function(e) {
          tooltip.style.display = 'block';
          tooltip.innerHTML = this.getAttribute('data-tip');
          tooltip.style.left = (e.pageX + 15) + 'px';
          tooltip.style.top = (e.pageY + 15) + 'px';
        });
        item.addEventListener('mouseleave', function() {
          tooltip.style.display = 'none';
        });
      });
    }

    document.getElementById("renderBtn").addEventListener("click", render);
    window.onload = render;
  </script>
</body>
</html>
