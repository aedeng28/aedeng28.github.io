<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Base a/b Tree</title>
  <style>
    body { font-family: monospace; background: #000; color: #0f0; margin: 0; padding: 10px; overflow: hidden; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
    h1 { margin: 5px 0; font-size: 1.1rem; flex-shrink: 0; }
    .controls { background: #111; padding: 8px; border: 1px solid #0f0; margin-bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
    .param { display: flex; align-items: center; gap: 4px; }
    button { background: #0f0; color: #000; font-weight: bold; padding: 5px 10px; border: none; cursor: pointer; font-family: monospace; font-size: 12px; }
    input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 3px; width: 40px; font-family: monospace; font-size: 12px; text-align: center; }
    #canvas-container { position: relative; width: 100%; flex-grow: 1; border: 1px solid #333; background: #050505; overflow: hidden; }
    svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    svg:active { cursor: grabbing; }
    line { stroke: #0f0; stroke-width: 1.5; opacity: 0.6; }
    circle { fill: #000; stroke: #0f0; stroke-width: 2; }
    text { fill: #0f0; font-size: 11px; text-anchor: middle; dominant-baseline: central; font-weight: bold; pointer-events: none; }
    .digit { fill: #fa0; font-size: 10px; font-weight: bold; }
    .hud { position: absolute; bottom: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 10; }
    .btn { width: 40px; height: 40px; font-size: 18px; background: #111; color: #0f0; border: 1px solid #0f0; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .btn:active { background: #0f0; color: #000; }
    #tip { background: #111; color: #0f0; padding: 8px; border: 1px solid #0f0; position: absolute; display: none; font-size: 12px; font-family: monospace; box-shadow: 0 0 8px #0f0; pointer-events: none; z-index: 5; max-width: 220px; }
  </style>
</head>
<body>

  <h1>[SYS_STATUS]: BASE a/b TREE (ALL MULTIPLES)</h1>
  
  <div class="controls">
    <div class="param"><label>a:</label><input type="number" id="baseA" value="3" min="2"></div>
    <div class="param"><label>b:</label><input type="number" id="baseB" value="2" min="1"></div>
    <div class="param"><label>Layers:</label><input type="number" id="maxDepth" value="5" min="1" max="10"></div>
    <button id="renderBtn">GENERATE</button>
  </div>

  <div id="canvas-container">
    <div id="tip"></div>
    <div class="hud">
      <div class="btn" id="zIn">+</div>
      <div class="btn" id="zOut">−</div>
      <div class="btn" id="home">⌂</div>
    </div>
    <svg id="svg"></svg>
  </div>

  <script>
    const svg = document.getElementById("svg");
    const tip = document.getElementById("tip");
    let view = { x: 19000, y: 0, w: 2000, h: 1200 }, isDrag = false, start = { x: 0, y: 0 };

    function getBranches(x, a, b) {
      let res = [];
      for (let d = 0; d < a; d++) {
        if (x === 0 && d === 0) continue;
        let v = (a * x) + (d * a);
        if (v % b === 0) res.push({ val: v / b, d: d });
      }
      return res;
    }

    function buildData() {
      const a = parseInt(document.getElementById("baseA").value) || 3;
      const b = parseInt(document.getElementById("baseB").value) || 2;
      const max = parseInt(document.getElementById("maxDepth").value) || 5;
      let nodes = [], edges = [], id = 0;
      let q = [{ id: id++, val: 0, path: "", depth: 0, x: 20000, y: 80, min: 0, max: 40000 }];

      while (q.length > 0) {
        let curr = q.shift();
        nodes.push(curr);
        if (curr.depth >= max) continue;

        let kids = getBranches(curr.val, a, b);
        if (kids.length === 0) continue;
        let w = (curr.max - curr.min) / kids.length;

        kids.forEach((k, i) => {
          let xMin = curr.min + (i * w), xMax = xMin + w;
          let child = { id: id++, val: k.val, path: curr.path + k.d, depth: curr.depth + 1, x: xMin + w/2, y: 80 + (curr.depth + 1)*160, min: xMin, max: xMax };
          edges.push({ from: curr.id, to: child.id, d: k.d });
          q.push(child);
        });
      }
      return { nodes, edges };
    }

    function showView() { svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`); }
    function resetView() { view = { x: 19000, y: 0, w: 2000, h: 1200 }; showView(); }

    function render() {
      svg.innerHTML = '';
      const data = buildData();
      if (!data) return;
      let html = "";

      data.edges.forEach(e => {
        let p = data.nodes.find(n => n.id === e.from), c = data.nodes.find(n => n.id === e.to);
        if (p && c) {
          html += `<line x1="${p.x}" y1="${p.y}" x2="${c.x}" y2="${c.y}" />`;
          html += `<text x="${(p.x+c.x)/2}" y="${(p.y+c.y)/2 - 8}" class="digit">${e.d}</text>`;
        }
      });

      data.nodes.forEach(n => {
        let txt = `<strong>Val:</strong> ${n.val}<br><strong>Path:</strong> ${n.path||'0'}<br><strong>Base a/b:</strong> <span style='color:#fa0'>${n.path||'0'}0</span>`;
        html += `<g class="ng" data-tip="${txt}"><circle cx="${n.x}" cy="${n.y}" r="22" /><text x="${n.x}" y="${n.y}">${n.val}</text></g>`;
      });

      svg.innerHTML = html;
      resetView();

      document.querySelectorAll('.ng').forEach(item => {
        const move = (e) => {
          tip.style.display = 'block'; tip.innerHTML = item.getAttribute('data-tip');
          let cx = e.clientX || (e.touches && e.touches[0].clientX), cy = e.clientY || (e.touches && e.touches[0].clientY);
          tip.style.left = (cx + 12) + 'px'; tip.style.top = (cy + 12) + 'px';
        };
        item.addEventListener('mousemove', move);
        item.addEventListener('touchstart', (e) => { e.stopPropagation(); move(e); });
        item.addEventListener('mouseleave', () => tip.style.display = 'none');
      });
    }

    function zoom(f) {
      let cx = view.x + view.w/2, cy = view.y + view.h/2;
      view.w *= f; view.h *= f; view.x = cx - view.w/2; view.y = cy - view.h/2; showView();
    }

    const getPos = (e) => ({ x: e.clientX || e.touches[0].clientX, y: e.clientY || e.touches[0].clientY });
    const dragStart = (e) => { isDrag = true; start = getPos(e); };
    const dragMove = (e) => {
      if (!isDrag) return;
      let p = getPos(e), factor = view.w / svg.clientWidth;
      view.x -= (p.x - start.x) * factor; view.y -= (p.y - start.y) * factor; showView(); start = p;
    };

    svg.addEventListener("mousedown", dragStart); svg.addEventListener("touchstart", (e) => { if(e.touches.length===1) dragStart(e); });
    window.addEventListener("mousemove", dragMove); window.addEventListener("touchmove", (e) => { if(e.touches.length===1) dragMove(e); });
    window.addEventListener("mouseup", () => isDrag = false); window.addEventListener("touchend", () => isDrag = false);

    svg.addEventListener("wheel", (e) => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.1 : 0.9); });
    document.getElementById("zIn").addEventListener("click", () => zoom(0.8));
    document.getElementById("zOut").addEventListener("click", () => zoom(1.25));
    document.getElementById("home").addEventListener("click", resetView);
    document.getElementById("renderBtn").addEventListener("click", render);
    document.getElementById("canvas-container").addEventListener("touchstart", () => tip.style.display = 'none');
    window.onload = render;
  </script>
</body>
</html>
