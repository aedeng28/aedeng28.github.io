<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Lab Studio</title>
    <style>
        :root {
            --bg: #0f0f11;
            --card: #16161a;
            --accent: #6366f1;
            --border: #2a2a30;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; padding-bottom: 12px; border-bottom: 2px solid var(--border); }
        .group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
        select, textarea, input {
            width: 100%; padding: 12px; box-sizing: border-box; background: #0f0f11;
            border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 15px;
        }
        select:focus, textarea:focus, input:focus { outline: none; border-color: var(--accent); }
        .actions { display: flex; gap: 10px; margin: 20px 0; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 6px; 
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .enc-btn { background: var(--accent); color: #fff; }
        .dec-btn { background: #2a2a30; color: var(--text); border: 1px solid var(--border); }
        .output {
            background: #0f0f11; border: 1px solid var(--border); border-radius: 6px;
            padding: 15px; min-height: 50px; white-space: pre-wrap; word-break: break-all;
            font-family: monospace; color: #10b981; font-size: 14px;
        }
        .hide { display: none; }
        .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cipher Lab Studio</h2>
    <p> note: the cipher algorithm was made origanlly by me, and the reason i used ai is because it crashed and delted all my progress</p>
    <div class="group">
        <label for="cipherVersion">Cipher Version:</label>
        <select id="cipherVersion" onchange="toggleFields()">
            <option value="old">Old (Multiplicative Vigenère)</option>
            <option value="new">New (Secure XOR Pad)</option>
        </select>
    </div>

    <div class="group">
        <label for="inputData">Input Text:</label>
        <textarea id="inputData" rows="4" placeholder="Text to encrypt or decrypt..."></textarea>
    </div>

    <div class="group" id="oldKeyWrap">
        <label for="oldKey">Key (Letters only, no spaces):</label>
        <input type="text" id="oldKey" placeholder="e.g., secret">
    </div>

    <div class="group hide" id="newKeyWrap">
        <label for="newKey">Key Block (Base64 Text or Hex):</label>
        <input type="text" id="newKey" placeholder="Leave blank to generate on encryption">
        <div class="hint">Paste your generated pad key here when decrypting.</div>
    </div>

    <div class="actions">
        <button class="enc-btn" onclick="run(true)">Encrypt</button>
        <button class="dec-btn" onclick="run(false)">Decrypt</button>
    </div>

    <div class="group">
        <label>System Output:</label>
        <div id="output" class="output">Awaiting operation...</div>
    </div>
</div>

<!-- Connect the logic script file -->
<script src="engine.js"></script>
</body>
</html>
